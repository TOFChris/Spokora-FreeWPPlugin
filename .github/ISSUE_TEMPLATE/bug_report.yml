name: Bug report
description: Something broken in Spokora Free
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This repo is **Spokora Free only** — not Spokora Pro.
  - type: input
    id: version
    attributes:
      label: Spokora Free version
      placeholder: e.g. 0.1.17
    validations:
      required: true
  - type: input
    id: wp
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
